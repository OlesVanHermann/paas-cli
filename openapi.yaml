    PaasError:
      type: object
      description: |
        Erreur complète d'un build, d'un scan, d'un plan, d'une admission ou
        d'un démarrage (schéma `paas.error.v1`, API 2.28.0 et suivantes). Tout
        y est pour corriger sans autre requête : l'étape, la cause, les détails
        propres au code, la marche à suivre et la fin du journal. Les textes
        sont à afficher tels quels ; aucune valeur de secret n'y figure.

        Codes et contenu de `details` :
        - `security_scan_blocked` (étape `scan`) : `policy` (`block_on`, nombre
          d'exceptions, origine), `counts`, `blocking` (chaque faille bloquante :
          `id`, `severity`, `package`, `installed`, `fixed`, `target`, `title`),
          `blocking_total`, `blocking_distinct`, `accepted` ;
        - `plan_refused` (étape `plan`) : `file`, `diagnostics` (code, chemin
          de la clé, message ; depuis l'API 2.31.0, aussi `owner`,
          `capability`, `basis`, et `refusal` quand un refus générique nomme
          le contrôle en cause), `diagnostics_total` ;
        - `build_step_failed`, `build_timed_out` (étape `build`) :
          `failed_tasks`, `platform_message`, `refusal` (`code`, `path`, `rule`)
          quand un contrôle documenté a échoué ;
        - `tests_failed` (étape `test`) : `tests` (commande, code de sortie),
          `failed_tasks`, `platform_message` ;
        - `admission_refused` (étape `admission`) : `platform_code`, `reason`,
          `platform_message` ;
        - `secrets_not_provided` (étape `admission`, API 2.48.0) : `missing`
          (chaque `secrets.<NOM>` déclaré `provide` sans valeur) ; la release
          attend (`awaiting_secrets`), une étape de `remediation` par valeur ;
        - `rollout_failed` (étape `rollout`) : `reason` (`oom_killed`,
          `probe_failed`, `process_exited`, `container_config`, `not_ready`,
          `unschedulable`, `request_larger_than_nodes`, `volume_mount`,
          `image_pull`, `not_created`, `not_started`, `apply_refused`,
          `apply_timed_out`), `process`, `verdict`, `container_state`,
          `containers`, `events`, `probes`, `resources`, `port` ; depuis l'API
          2.48.0, `not_created` (aucun pod créé) et `not_started` (aucun
          conteneur démarré) disent pourquoi, et `runtime_gap` la cause que le
          journal établit (`owner`, `capability` ou `key`, `extension`,
          `recipe`, `evidence`) ;
        - `database_not_ready` (étape `rollout`) : `service`, `platform_code`,
          `readiness_window_seconds`, `container_state`, `containers`, `events` ;
        - `deploy_failed` : objet de repli d'un échec antérieur à l'API 2.28.0
          (voir `App.last_error`).

        Un code inconnu du client se lit comme les autres : `summary`,
        `message`, `remediation` et `details` restent valables.
      required:
      - schema
      - code
      - stage
      - summary
      - message
      properties:
        schema:
          type: string
          description: Toujours `paas.error.v1`
        code:
          type: string
          description: Code stable (voir la description du schéma)
          x-paas-observed-values:
          - security_scan_blocked
          - plan_refused
          - build_step_failed
          - build_timed_out
          - tests_failed
          - admission_refused
          - secrets_not_provided
          - rollout_failed
          - database_not_ready
          - deploy_failed
        legacy_code:
          type: string
          nullable: true
          description: Code d'avant l'API 2.28.0, quand il en existait un
        stage:
          type: string
          description: Étape en échec
          x-paas-observed-values:
          - intake
          - plan
          - clone
          - prepare
          - build
          - test
          - scan
          - sign
          - admission
          - rollout
          - runtime
        summary:
          type: string
          description: Ce qui a échoué et pourquoi, en une phrase complète
        message:
          type: string
          description: L'explication détaillée
        app_id:
          type: string
          nullable: true
        deploy_id:
          type: string
          nullable: true
        build_id:
          type: string
          nullable: true
        commit:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
          nullable: true
          description: Absent de l'objet de repli d'un échec antérieur à l'API 2.28.0
        details:
          type: object
          additionalProperties: true
          nullable: true
          description: Propre au code (voir la description du schéma)
        remediation:
          type: array
          items:
            $ref: '#/components/schemas/Remediation'
          description: |
            Marche à suivre, dans l'ordre. Depuis l'API 2.31.1, elle suit qui doit agir : pour `Paas`, la première étape dit ce que la plateforme doit lever et aucune ne demande de corriger le paas.xml ou le dépôt ; pour une cause présumée, les étapes de diagnostic restent.
        log_excerpt:
          allOf:
          - $ref: '#/components/schemas/LogExcerpt'
          nullable: true
        links:
          type: object
          additionalProperties:
            type: string
          description: Chemins d'API liés (`build`, `cve`, `tests`…)
        responsibility:
          allOf:
          - $ref: '#/components/schemas/Responsibility'
          nullable: true
          description: |
            Qui doit agir (API 2.31.0) : le client (`Cust`) ou la plateforme
            (`Paas`). Depuis l'API 2.48.0, l'imputation est celle du verdict,
            enregistrée avec lui (`rules`, `decided_at`) et servie telle quelle
            à chaque lecture ; calculée seulement pour une erreur enregistrée
            sans imputation. Absent d'un serveur antérieur à l'API 2.31.0.
        reclassification:
          allOf:
          - $ref: '#/components/schemas/Responsibility'
          nullable: true
          description: |
            API 2.48.0 : la lecture des règles du jour quand elle décide
            autrement que le verdict, à côté de lui, jamais à sa place ; `at`
            la date quand un passage des règles du jour l'a datée. La marche à
            suivre suit la lecture la plus récente.
        reviewed_rules:
          type: string
          nullable: true
          description: |
            API 2.48.0 : la version des règles du dernier passage qui a relu
            cette imputation au démarrage de la plateforme ;
            `reclassification` en est le résultat quand il décide autrement.
