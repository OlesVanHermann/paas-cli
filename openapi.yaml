    Responsibility:
      type: object
      description: |
        Qui doit agir sur un échec (API 2.31.0). `Cust` : le paas.xml ou le
        dépôt de l'application se corrige. `Paas` : la plateforme ne sait pas
        encore installer l'application ; `capability` nomme ce qui lui manque,
        et ses opérateurs sont prévenus.
      required:
      - owner
      - label
      - basis
      - code
      - summary
      properties:
        owner:
          type: string
          description: Qui agit
          x-paas-observed-values:
          - customer
          - platform
        label:
          type: string
          description: Badge à afficher
          x-paas-observed-values:
          - Cust
          - Paas
        basis:
          type: string
          description: |
            Comment c'est établi : `documented` (index des codes de refus),
            `rule` (nature de l'échec), `family` (code pas encore documenté,
            classé par sa famille) ou `presumption` (cause non établie,
            présumée côté plateforme)
          x-paas-observed-values:
          - documented
          - rule
          - family
          - presumption
        code:
          type: string
          description: |
            Le code qui décide : code de refus (`ENV_…`, `V2_…`), code
            d'exécution (`TECHNICAL_…`), raison du rollout, ou le code de
            l'erreur
        capability:
          type: string
          nullable: true
          description: Pour la plateforme, la capacité qui lui manque (`composer.archive_size`, `pipeline.scan_gate`…)
        summary:
          type: string
          description: La phrase à montrer telle quelle
        transient:
          type: boolean
          description: |
            API 2.47.0 : incident passager de la plateforme (une origine
            injoignable un moment, la base du scanner par exemple) ; rien ne
            manque, reconstruire le même commit suffit (`capability` nomme
            l'étape touchée). Absent quand il vaut `false`.
        rules:
          type: string
          nullable: true
          description: |
            API 2.48.0 : la version des règles qui ont décidé (celle de la
            plateforme) ; absent d'une imputation enregistrée avant.
        decided_at:
          type: string
          format: date-time
          nullable: true
          description: 'API 2.48.0 : quand le verdict a été décidé'
        at:
          type: string
          format: date-time
          nullable: true
          description: Dans `reclassification` seulement, quand un passage des règles du jour l'a datée
