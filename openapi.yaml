      operationId: get_tenant_smtp
      tags:
      - tenant
      summary: Serveur SMTP du tenant
      x-paas-envelope: data
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SmtpMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: configure_tenant_smtp
      tags:
      - tenant
      summary: Configure le serveur SMTP du tenant
      x-paas-envelope: data
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureSmtpRequest'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SmtpMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
    delete:
      operationId: delete_tenant_smtp
      tags:
      - tenant
      summary: Supprime le serveur SMTP du tenant
      x-paas-envelope: data
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      deleted: {}
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tenant}/smtp/effective:
    get:
      operationId: effective_tenant_smtp
      tags:
      - tenant
      summary: Serveur SMTP effectivement utilisé
      x-paas-envelope: data
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SmtpMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces:
    get:
      operationId: list_workspaces
      tags:
      - team
      summary: Espaces de travail
      x-paas-envelope: data
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: create_workspace
      tags:
      - team
      summary: Crée un espace de travail
      x-paas-envelope: data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableBody'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AppRef:
      name: app_id
      in: path
      required: true
      description: Nom **ou** UUID de l'application, résolu dans le tenant de l'appelant
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Clé choisie par le client : rejouer la même requête avec la même clé ne l''exécute qu''une fois'
      schema:
        type: string
        maxLength: 255
  responses:
    Unauthorized:
      description: Jeton absent, invalide, expiré ou révoqué
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    NotFound:
      description: |
        Ressource inconnue dans le tenant : corps JSON `ErrorDocument` (code
        `not_found`). Route inexistante : corps vide.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    UnprocessableBody:
      description: Corps de la requête rejeté avant traitement (texte brut)
      content:
        text/plain:
          schema:
            type: string
    ServiceUnavailable:
      description: Dépendance indisponible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
  schemas:
    AcceptDocumentRequest:
      type: object
      properties:
        document_type:
          type: string
        version:
          type: string
        sha256_hash:
          type: string
      required:
      - document_type
      - version
      - sha256_hash
    AcceptDocumentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        document_type: {}
        version:
          type: string
        accepted_at:
          type: string
      required:
      - id
      - document_type
      - version
      - accepted_at
    AckResponse:
      type: object
      properties:
        acked:
          type: boolean
        ack_until:
          type: string
          nullable: true
      required:
      - acked
    ActivateResponse:
      type: object
      properties:
        status: {}
        estimated_cold_start_secs:
          type: integer
          format: int64
        retry_after_secs:
          type: integer
          format: int64
        message: {}
        warning:
          allOf:
          - $ref: '#/components/schemas/ColdStartWarning'
          nullable: true
      required:
      - status
      - estimated_cold_start_secs
      - retry_after_secs
      - message
    ActivateStatusPageRequest:
      type: object
      properties:
        public_url:
          type: string
          nullable: true
    AddDomainRequest:
      type: object
      properties:
        domain:
          type: string
      required:
      - domain
    AddDomainResponse:
      type: object
      properties:
        domain:
          type: string
        tls_status:
          type: string
        dns_configured:
          type: boolean
        verified_at:
          type: string
          format: date-time
          nullable: true
        instructions:
          type: string
        verification:
          $ref: '#/components/schemas/VerificationInstructions'
      required:
      - domain
      - tls_status
      - dns_configured
      - instructions
      - verification
    AddProcessRequest:
      type: object
      properties:
        type:
          type: string
        command:
          type: string
        instances:
          type: integer
          format: int32
        size:
          type: string
          nullable: true
      required:
      - type
      - command
      - instances
    AdmissionPreflight:
      type: object
      properties:
        app_id:
          type: string
          format: uuid
        tenant_id:
          type: string
        recovery_state:
          $ref: '#/components/schemas/RecoveryState'
        recovery_generation:
          type: integer
          format: int64
        eligible:
          type: boolean
        missing_evidence:
          type: array
          items:
            type: string
        required_action:
          $ref: '#/components/schemas/RequiredAction'
        adoption_state:
          $ref: '#/components/schemas/AdoptionState'
        restore_blocked:
          type: boolean
        restore_block_reason:
          type: string
          nullable: true
        retention_until:
          type: string
          format: date-time
          nullable: true
        retention_expired:
          type: boolean
        workload_ready:
          type: boolean
        edge_suspended:
          type: boolean
      required:
      - app_id
      - tenant_id
      - recovery_state
      - recovery_generation
      - eligible
      - missing_evidence
      - required_action
      - adoption_state
      - restore_blocked
      - retention_expired
      - workload_ready
      - edge_suspended
    AdoptionState:
      type: string
      enum:
      - none
      - pending
      - proven
      - failed
    AgentsQuotaResponse:
      type: object
      properties:
        agents_used:
          type: integer
          format: int64
        agents_limit:
          type: integer
          format: int64
          nullable: true
        agents_remaining:
          type: integer
          format: int64
          nullable: true
        tokens_used:
          type: integer
          format: int64
        tokens_quota:
          type: integer
          format: int64
          nullable: true
        tokens_remaining:
          type: integer
          format: int64
          nullable: true
      required:
      - agents_used
      - tokens_used
    AggregatedErrors:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/ErrorSummary'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        recent:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntry'
      required:
      - summary
      - timeline
      - recent
    AllocateGpuRequest:
      type: object
      properties:
        app_id:
          type: string
        gpu_type:
          type: string
        gpu_count:
          type: integer
          format: int32
        pool_name:
          type: string
      required:
      - app_id
      - gpu_type
      - gpu_count
      - pool_name
    ApiKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        created_at:
          type: string
      required:
      - id
      - name
      - prefix
      - created_at
    App:
      type: object
      description: |
        Seuls `id` et `name` sont garantis. `http_endpoints`,
        `http_endpoints_status` et `serving_deploy_id` ne sont renvoyés que par
        `get_app`.
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tenant_id:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          x-paas-observed-values:
          - running
        error_message:
          type: string
          nullable: true
          description: |
            Pourquoi l'application est en état `error`, tel que la plateforme
            le relève sur son exécution (par exemple `pod CrashLoopBackOff:
            restarts=8`) ; absent sinon.
        region:
          type: string
          nullable: true
        subdomain:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        port:
          type: integer
          nullable: true
        port_source:
          type: string
          nullable: true
          x-paas-observed-values:
          - explicit
        git_url:
          type: string
          nullable: true
        git_branch:
          type: string
          nullable: true
          description: Branche Git suivie par l'application, quand elle est fixée
        image:
          type: string
          nullable: true
        image_digest:
          type: string
          nullable: true
        build_id:
          type: string
          nullable: true
        commit_sha:
          type: string
          nullable: true
        pipeline_run_id:
          type: string
          nullable: true
        harbor_project:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        installation:
          type: object
          nullable: true
          additionalProperties: true
        scan_status:
          type: string
          nullable: true
          x-paas-observed-values:
          - verified
        sbom_status:
          type: string
          nullable: true
          x-paas-observed-values:
          - verified
        signature_status:
          type: string
          nullable: true
          x-paas-observed-values:
          - verified
        attestation_status:
          type: string
          nullable: true
          x-paas-observed-values:
          - verified
        test_status:
          type: string
          nullable: true
          x-paas-observed-values:
          - passed
        promoted_digest:
          type: string
          nullable: true
        served_digest:
          type: string
          nullable: true
        signed_digest:
          type: string
          nullable: true
        signoz_service_id:
          type: string
          nullable: true
        http_endpoints:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
        http_endpoints_status:
          type: string
          nullable: true
        serving_deploy_id:
          type: string
          nullable: true
        current_release:
          allOf:
          - $ref: '#/components/schemas/CurrentRelease'
          nullable: true
          description: |
            Renvoyé par `get_app` (API 2.48.0) : la release que l'application
            sert, telle que `list_deploys` la projette ; `null` sans release
            servie.
        last_error:
          allOf:
          - $ref: '#/components/schemas/PaasError'
          nullable: true
          description: |
            Renvoyé par `get_app` : l'erreur complète du dernier déploiement
            quand il a échoué, `null` sinon. C'est la réponse à « pourquoi
            l'application ne sert rien de neuf ». Pour un échec antérieur à
            l'API 2.28.0, objet de repli : `code` (l'ancien `failure_code`,
            sinon `deploy_failed`), `stage`, `summary` et `message` (l'ancien
            `error_message`), `build_id`, sans `occurred_at` ni `details`.
        last_failure:
          allOf:
          - $ref: '#/components/schemas/AppFailure'
          nullable: true
          description: |
            Renvoyé par `list_apps` (API 2.31.0) et par `get_app` (API
            2.48.0, le même objet) : l'échec du dernier déploiement de
            l'application, avec qui doit agir (`Cust` ou `Paas`), `null` s'il
            n'a pas échoué. L'erreur complète est `last_error` de `get_app`.
    AppAddon:
      type: object
