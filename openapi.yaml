openapi: 3.0.3
info:
  title: PaaS di2amp — API tenant
  version: 0.1.0
  description: |
    Contrat de l'API tenant du PaaS di2amp, vérifié contre l'API 2.64.0.

    Il couvre les 437 opérations accessibles aux clients et fait foi pour le SDK `paas-sdk` et la CLI `paas-apps` de ce dépôt.

    Enveloppes des réponses (`x-paas-envelope`) :
    - `data` : `{ "data": T }`
    - `data-meta` : `{ "data": [T], "meta": ListMeta }`
    - `bare` : la valeur seule
    - `none` : aucun corps
    - `raw` : contenu brut (fichier, texte, redirection)
    - `stream` : flux continu (journaux, terminal)

    Erreurs : JSON `ErrorDocument` pour les erreurs métier ; `text/plain` quand
    le corps de la requête est rejeté avant traitement (422) ; corps vide quand
    la route n'existe pas (404) ou que la méthode est refusée (405).

    Échec d'un build ou d'un déploiement : la requête réussit (200) et l'objet
    porte l'erreur complète `PaasError` (schéma `paas.error.v1`) : `error` sur un
    déploiement (et sur sa release liée), `failure` sur un build, `last_error`
    sur une application, `error` sur un rapport CVE refusé. Il donne l'étape,
    la cause en une phrase, les détails propres au code (failles bloquantes,
    diagnostics du `paas.xml`, commande de test, état du conteneur…), la marche
    à suivre (`remediation` : commande, extrait de `paas.xml`, documentation) et
    la fin du journal (`log_excerpt`).

    Les opérations qui portent `x-paas-idempotency-key: supported` acceptent
    l'en-tête `Idempotency-Key` : rejouer la même requête avec la même clé ne
    l'exécute qu'une fois. Les autres écritures ne doivent jamais être rejouées
    automatiquement.
  x-paas-api-version-tested: 2.64.0
servers:
- url: https://console.di2amp.com/api
  description: Production (préfixe `/api` devant `/v1/...`)
security:
- bearerAuth: []
tags:
- name: addons
  description: Services managés attachés aux applications (bases de données, caches, files…) et leurs sauvegardes
- name: ai
  description: Agents IA, points de terminaison IA, GPU, fine-tuning et bases vectorielles
- name: apps
  description: Applications du tenant, cycle de vie, restauration, environnements de prévisualisation
- name: auth
  description: Sessions, connexion (mot de passe, OAuth, MFA), jetons, clés API et clés SSH
- name: billing
  description: Offres, consommation, factures, moyens de paiement et alertes de dépense
- name: builds
  description: Constructions d'images, preuves (scan, SBOM, signature), cache et pipelines
- name: config
  description: Variables de configuration, secrets et coffres externes
- name: deploys
  description: Déploiements (releases), promotion et retour arrière
- name: domains
  description: Domaines personnalisés et certificats
- name: environments
  description: Environnements d'exécution standard (catalogue, plans)
- name: functions
  description: Fonctions serverless
- name: git
  description: Dépôts Git liés, accès Git et sources
- name: meta
  description: Santé, régions et catalogues publics
- name: observability
  description: Journaux, métriques, traces, erreurs, alertes et pages de statut
- name: team
  description: Membres, invitations et espaces de travail
- name: tenant
  description: Réglages du tenant (SSO, fournisseurs d'identité, SMTP, réseau, conformité RGPD)
- name: volumes
  description: Volumes persistants et instantanés
