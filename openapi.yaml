    Deploy:
      type: object
      description: |
        Un déploiement (release). Dans `list_deploys`, il porte en plus son
        état courant et les preuves de l'image (digests, scan, signature). Dans
        `get_deploy`, il porte sa prise en charge (`intake_state`, `failure_*`)
        et sa release liée.
      required:
      - id
      - app_id
      - status
      properties:
        id:
          type: string
        app_id:
          type: string
        status:
          type: string
          x-paas-observed-values:
          - running
          - ready
          - superseded
          - failed
          - crashloop
          - awaiting_secrets
          - scaled-zero
          - maintenance
          - unavailable
          - unknown
          description: |
            État enregistré ; dans `list_deploys`, la release que l'application
            sert porte l'état de son workload : `running`, `scaled-zero`
            (appliquée à 0 réplique, depuis l'API 2.48.0 aussi après la route de
            mise à l'échelle : `paas scale web 1` la sert), `maintenance`,
            `unavailable` ou `unknown`. `awaiting_secrets` (API 2.48.0) :
            build, tests, scan et signature faits, la release attend les valeurs
            que le locataire fournit (`list_provided_secrets`) ; elle repart
            seule quand la dernière est fournie (`provide_secret`), sans
            nouveau push.
        image_ref:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        replicas:
          $ref: '#/components/schemas/ReplicaStatus'
        build_id:
          type: string
          nullable: true
        commit_sha:
          type: string
          nullable: true
        pipeline_run_id:
          type: string
          nullable: true
        source_repo:
          type: string
          nullable: true
        source_branch:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        rollout_status:
          type: string
          nullable: true
          description: |
            `scaled-zero` (API 2.48.0) : release appliquée à 0 réplique
            (`status` `ready`), jamais jugée sur une fenêtre ; elle est la
            release de l'application et `paas scale web 1` la sert.
            `pending` : déploiement non commencé, y compris, depuis l'API
            2.48.1, pendant `awaiting_secrets` (`progressing` en 2.48.0).
        image_digest:
          type: string
          nullable: true
        signed_digest:
          type: string
          nullable: true
        promoted_digest:
          type: string
          nullable: true
        served_digest:
          type: string
          nullable: true
        scan_status:
          type: string
          nullable: true
        signature_status:
          type: string
          nullable: true
        attestation_status:
          type: string
          nullable: true
        promotion_error:
          type: string
          nullable: true
        intake_state:
          type: string
          nullable: true
        failure_kind:
          type: string
          nullable: true
          description: Étape de l'échec ; vaut `error.stage` quand `error` est présent
        failure_code:
          type: string
          nullable: true
          description: Code de l'échec ; vaut `error.code` quand `error` est présent
        error:
          allOf:
          - $ref: '#/components/schemas/PaasError'
          nullable: true
          description: |
            Erreur complète (`paas.error.v1`) d'un déploiement en échec, dans
            `list_deploys` et `get_deploy`. Absent pour un déploiement réussi et
            pour un échec antérieur à l'API 2.28.0, qui ne garde que
            `error_message`, `failure_code` et `failure_kind`.
        release:
          $ref: '#/components/schemas/ReleaseLink'
